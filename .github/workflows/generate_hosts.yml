name: Auto Generate Hosts List

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'hosts' # Tránh bị lặp vô tận (infinite loop) khi bot commit lại file hosts
  schedule:
    # Chạy tự động vào lúc 00:00 UTC hằng ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để commit file hosts lên repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Blocklist Generator Script
        env:
          # Tùy chọn: Truyền Proxy nếu bạn cài đặt Secret trong Repository (Settings -> Secrets)
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTP_PROXY }}
        run: python generate_hosts.py

      - name: Commit and Push updated hosts file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add hosts
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào trong file hosts."
          else
            git commit -m "Auto generator hosts blocklist [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
