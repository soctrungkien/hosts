name: Auto Generate Hosts List

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'hosts'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Blocklist Generator Script
        run: python generate_hosts.py

      - name: Commit and Push updated hosts file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add hosts
          if git diff --staged --quiet; then
            echo "No changes detected in hosts file."
          else
            git commit -m "Auto update hosts blocklist [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
          
